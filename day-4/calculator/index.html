<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc-container">
    <h1 class="sr-only">Calculator</h1>
    <div class="calculator" role="application" aria-label="Calculator">
      <div class="display" id="display" aria-live="polite">0</div>

      <div class="buttons">
        <button class="btn wide" data-action="clear">C</button>
        <button class="btn" data-action="back">⌫</button>
        <button class="btn" data-value="%">%</button>

        <button class="btn" data-value="7">7</button>
        <button class="btn" data-value="8">8</button>
        <button class="btn" data-value="9">9</button>
        <button class="btn op" data-value="/">÷</button>

        <button class="btn" data-value="4">4</button>
        <button class="btn" data-value="5">5</button>
        <button class="btn" data-value="6">6</button>
        <button class="btn op" data-value="*">×</button>

        <button class="btn" data-value="1">1</button>
        <button class="btn" data-value="2">2</button>
        <button class="btn" data-value="3">3</button>
        <button class="btn op" data-value="-">−</button>

        <button class="btn" data-value="0">0</button>
        <button class="btn" data-value=".">.</button>
        <button class="btn" data-action="equals" class="equals">=</button>
        <button class="btn op" data-value="+">+</button>
      </div>
    </div>
    <p class="hint">You can also use your keyboard for input and Enter to evaluate.</p>
  </main>
  <a href="https://roadmap.sh"><img src="https://roadmap.sh/card/tall/6a0d41c811fa913c0685d68a?variant=dark&roadmaps=full-stack%2Chtml%2Ccss%2Cjavascript" alt="roadmap.sh"/></a>
  <script src="script.js"></script>
</body>
</html>
