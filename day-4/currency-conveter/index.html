<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <main class="container">
        <section class="card">
            <div class="header">
                <h1>Currency Converter</h1>
                <p class="intro">Convert currencies instantly with a smooth, responsive interface.</p>
            </div>

            <form id="converter-form" novalidate>
                <div class="field">
                    <label for="amount">Enter an amount</label>
                    <input id="amount" name="amount" type="text" inputmode="decimal" placeholder="e.g. 100" value="100">
                </div>

                <div class="currency-row">
                    <div class="field currency-field">
                        <label for="from-currency">From</label>
                        <div class="select-wrapper">
                            <img id="from-flag" src="https://flagsapi.com/US/flat/32.png" alt="US flag">
                            <select id="from-currency" name="from">
                                <option value="USD">USD</option>
                                <option value="INR">INR</option>
                                <option value="EUR">EUR</option>
                                <option value="AUD">AUD</option>
                                <option value="GBP">GBP</option>
                                <option value="JPY">JPY</option>
                                <option value="CAD">CAD</option>
                                <option value="SGD">SGD</option>
                                <option value="CHF">CHF</option>
                                <option value="AED">AED</option>
                            </select>
                        </div>
                    </div>

                    <button type="button" class="swap-btn" id="swap-button" aria-label="Swap currencies">
                        <i class="fa-solid fa-right-left"></i>
                    </button>

                    <div class="field currency-field">
                        <label for="to-currency">To</label>
                        <div class="select-wrapper">
                            <img id="to-flag" src="https://flagsapi.com/IN/flat/32.png" alt="India flag">
                            <select id="to-currency" name="to">
                                <option value="USD">USD</option>
                                <option value="INR" selected>INR</option>
                                <option value="EUR">EUR</option>
                                <option value="AUD">AUD</option>
                                <option value="GBP">GBP</option>
                                <option value="JPY">JPY</option>
                                <option value="CAD">CAD</option>
                                <option value="SGD">SGD</option>
                                <option value="CHF">CHF</option>
                                <option value="AED">AED</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="message" id="message" aria-live="polite"></div>
                <button type="submit" class="primary-btn">Get Exchange Rate</button>
            </form>

            <div class="result-panel hidden" id="result-panel">
                <p class="result-label">Converted amount</p>
                <p class="result" id="result-text"></p>
            </div>
        </section>
    </main>

    <script src="codes.js"></script>
    <script src="script.js"></script>
</body>
</html>
